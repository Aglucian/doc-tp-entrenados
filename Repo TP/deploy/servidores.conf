# Configuración común a todas las pruebas. La sobreescribe cada prueba.conf si hace falta.

# Usuario SSH en todos los servidores (acceso por clave pública, sin contraseña).
USUARIO=utnso

# Clon del repo que ya existe en cada servidor: de ahí se hace el fetch.
REPO_REMOTO=/home/utnso/tp-2026-2c-requiemso

# Todo lo que genera el despliegue vive acá: código, configs, logs, scripts, datos.
BASE_REMOTA=/home/utnso/tp-run

# Rama, tag o commit a desplegar cuando no se usa --local.
REF=origin/develop

# Servidores disponibles (solo informativo; cada prueba elige cuáles usa).
SERVIDORES="192.168.1.25 192.168.1.26 192.168.1.27 192.168.1.28 192.168.1.29"
