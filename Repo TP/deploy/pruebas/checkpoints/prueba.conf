# Checkpoints (Check 4): SAVE/LOAD/DELETE_CHECKPOINT entre scripts independientes y
# recuperación del journal ante un kill -9 del Storage. Se corre con correr.sh.

PLACA=192.168.1.25
STORAGE=192.168.1.26
PLANIFICADOR=192.168.1.27
CORES="1@192.168.1.28 2@192.168.1.29"

# correr.sh elige el script de cada fase con --job.
JOB_INICIAL=entrenar

CONFIG_PLACA="RETARDO_MEMORIA=5 RETARDO_OFFLOAD=20"
