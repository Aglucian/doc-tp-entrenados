# Mini Entrenamiento (Check 3): ALLOC + LOAD_BATCH + FORWARD/BACKWARD/UPDATE + REPORT + FREE.
# Con 4 marcos para 8 páginas fuerza page faults, reemplazo con CLOCK-M y bajadas al Offload.

# Dónde corre cada módulo. CORES: "id@ip" separados por espacio.
PLACA=192.168.1.25
STORAGE=192.168.1.26
PLANIFICADOR=192.168.1.27
CORES="1@192.168.1.28 2@192.168.1.29"

# Script inicial, relativo a PATH_INSTRUCCIONES de la Placa (sale de scripts/).
JOB_INICIAL=mini

# Claves que se pisan en el config base de cada módulo (CLAVE=VALOR separadas por espacio).
# IPs, puertos de destino y rutas los completa el despliegue.
CONFIG_PLACA="TAM_MEMORIA=256 TAM_PAGINA=64 ALGORITMO_REEMPLAZO=CLOCK-M RETARDO_MEMORIA=5 RETARDO_OFFLOAD=20"
CONFIG_STORAGE="RETARDO_ACCESO_BLOQUE=5 RETARDO_COMMIT=5"
CONFIG_PLANIFICADOR="ALGORITMO_PLANIFICACION=RR RR_QUANTUM=200 RETARDO_LOADER=100"
CONFIG_CORE=""

# Para "ejecutar": cuántos Jobs tienen que finalizar y cuánto esperar como máximo.
JOBS_ESPERADOS=1
TIEMPO_MAXIMO=60
