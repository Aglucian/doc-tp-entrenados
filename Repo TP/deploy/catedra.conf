# Reparto de los módulos para correr las pruebas de la cátedra (entrenados-pruebas).
# Cada servidor se puede pisar desde el entorno, por ejemplo para todo en una máquina:
#   PLACA=192.168.1.25 STORAGE=192.168.1.25 PLANIFICADOR=192.168.1.25 CORES_HOSTS=192.168.1.25 deploy/catedra.sh ...
PLACA="${PLACA:-192.168.1.25}"
STORAGE="${STORAGE:-192.168.1.26}"
PLANIFICADOR="${PLANIFICADOR:-192.168.1.27}"
# core-1.config va al primero, core-2.config al segundo, y así (se repite si hay más Cores).
CORES_HOSTS="${CORES_HOSTS:-192.168.1.28 192.168.1.29}"

# Clon de entrenados-pruebas en cada servidor y en esta máquina.
PRUEBAS_REMOTO=/home/utnso/entrenados-pruebas
PRUEBAS_LOCAL="$HOME/entrenados-pruebas"
