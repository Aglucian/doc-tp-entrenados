# Respuestas al Labeler, por escenario y por script del Job que pide la entrada.
# <checkpoint> <escenario> <script> <texto> <espera>
# La espera son segundos, o R<n>: responder cuando la Placa haya hecho n reemplazos más
# desde el pedido. En 06 la prueba es que el otro Job reemplace páginas mientras LABEL
# espera, sin que ninguna de las de LABEL sea víctima.
checkpoint_3 06_page_locking   label_lock.asm  ABCD R3
checkpoint_3 07_servicios_fifo servicios_a.asm ABCD 8
checkpoint_3 07_servicios_fifo servicios_b.asm WXYZ 8

# Comandos de consola del Storage después de reiniciarlo con la misma config (separados por ';').
# <checkpoint> <escenario> REINICIO <comandos>
checkpoint_3 10_storage_directorio REINICIO LS; CAT cp3_a 2; CAT cp3_c 2; RM cp3_a; RM cp3_c; LS; INFO
checkpoint_3 11_storage_bloques    REINICIO LS; INFO

# Entregas finales. "*" = textos que se responden en orden, a medida que el Labeler los pide.
# 03: "Antes de ingresar cada texto, esperar a que el Loader atienda a otro Job" -> L1.
entregas_finales 03_servicios * PERRO001,GATO0002,LORO0003 L1
